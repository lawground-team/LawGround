openapi: 3.1.0
info:
  title: LawGround 사용자 API
  version: 0.1.0-draft
  description: 문제 CRUD·제출 목록·OIDC/JDBC 인증·UI 기능 설정 및 검수 조문 조회와 개발 Mock 분석 API를 구현했다. 실제 모델·수집·추천은 후속 범위다. 팀 합의/전체 구현 완료를 뜻하지 않으며 모든 예시는 합성 데이터다.
servers:
- url: http://localhost:8081/api/v1
x-contract-status: draft-not-team-approved
paths:
  /app/config:
    get:
      operationId: getAppCapabilities
      summary: 화면에서 사용할 기능 상태
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: 공개 기능 플래그만 반환하며 키·회원·토큰은 포함하지 않음
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppCapabilities'
              example:
                googleLoginEnabled: true
                localEnvironment: true
                analysisAvailable: false

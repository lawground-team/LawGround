          maximum: 5
        text:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
      required:
      - number
      - text
    QuestionInput:
      type: object
      additionalProperties: false
      properties:
        subject: &id008
          type: string
          enum:
          - BROKER_LAW
        stem: &id009
          type: string
          minLength: 1
          maxLength: 10000
          pattern: \S
        questionType: &id010
          type: string
          enum:
          - SELECT_CORRECT
          - SELECT_INCORRECT
        choices: &id011
          type: array
          items:
            $ref: '#/components/schemas/Choice'
          minItems: 5
          maxItems: 5
          allOf:
          - contains:
              type: object
              properties:
                number:
                  const: 1
              required:
              - number
            minContains: 1
            maxContains: 1
          - contains:
              type: object
              properties:
                number:
                  const: 2
              required:
              - number
            minContains: 1
            maxContains: 1
          - contains:
              type: object
              properties:
                number:
                  const: 3
              required:
              - number
            minContains: 1
            maxContains: 1
          - contains:
              type: object
              properties:
                number:
                  const: 4
              required:
              - number
            minContains: 1
            maxContains: 1
          - contains:
              type: object
              properties:
                number:
                  const: 5
              required:
              - number
            minContains: 1
            maxContains: 1
        providedAnswerNumber: &id012
          type: integer
          minimum: 1
          maximum: 5
        referenceDate: &id013
          type: string
          format: date
      required:
      - subject
      - stem
      - questionType
      - choices

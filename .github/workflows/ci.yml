name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Repository boundaries
        run: python3 scripts/check_repository.py
      - name: Validate development Compose
        env:
          POSTGRES_PASSWORD: ci-compose-check-only
          RABBITMQ_PASSWORD: ci-compose-check-only
        run: docker compose config --quiet
      - name: Build, format, unit and real infrastructure tests
        working-directory: backend
        run: ./gradlew clean check bootJar --no-daemon
      - name: Verify backend container build
        run: docker build --tag lawground-backend:ci --file backend/Dockerfile .
      - name: Upload deployable Spring jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: lawground-deploy-jar
          path: |
            backend/build/libs/lawground-backend-*.jar
            !backend/build/libs/*-plain.jar
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          if-no-files-found: ignore

  contracts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-contracts.txt
      - name: Install contract validation tools
        run: python -m pip install -r scripts/requirements-contracts.txt
      - name: Validate contracts, examples and failure cases
        run: |
          python scripts/check_contracts.py
          python -m unittest discover -s scripts/tests -v

  ai-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Python service implementation
        id: check
        run: |
          if [ -f "ai-service/requirements.txt" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies and test
        if: steps.check.outputs.exists == 'true'
        working-directory: ai-service
        run: |
          python -m pip install -r requirements.txt
          python -m pytest
      - name: Python service not implemented yet
        if: steps.check.outputs.exists == 'false'
        run: echo "ai-service is a directory scaffold; no Python tests claimed."

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Frontend syntax and behavior tests
        run: node frontend/scripts/check.mjs

  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned browser test runtime
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Real browser, database, queue and signed test issuer
        working-directory: backend
        run: ./gradlew frontendE2E --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-workflow-evidence
          path: backend/build/browser-e2e/
          if-no-files-found: ignore

  ci-summary:
    needs: [backend-check, contracts-check, ai-check, frontend-check, browser-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to complete successfully
        env:
          BACKEND_RESULT: ${{ needs.backend-check.result }}
          CONTRACTS_RESULT: ${{ needs.contracts-check.result }}
          AI_RESULT: ${{ needs.ai-check.result }}
          FRONTEND_RESULT: ${{ needs.frontend-check.result }}
          BROWSER_RESULT: ${{ needs.browser-check.result }}
        run: |
          test "$BACKEND_RESULT" = "success"
          test "$CONTRACTS_RESULT" = "success"
          test "$AI_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"

  publish-deployment:
    needs: ci-summary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lawground-deploy-jar
          path: staging/jar
      - name: Bundle the tested application
        run: bash ops/build-deploy-bundle.sh "$GITHUB_SHA" staging/jar/lawground-backend-*.jar
      - name: Publish the deployment asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="deploy-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" "lawground-$GITHUB_SHA.tar.gz" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Deployment ${GITHUB_SHA:0:12} ($GITHUB_RUN_ATTEMPT)" \
            --notes "Built by https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

spring:
  application:
    name: lawground-backend
  profiles:
    default: local
  main:
    web-application-type: servlet
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      enabled: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

lawground:
  analysis:
    mock-enabled: ${LAWGROUND_ANALYSIS_MOCK_ENABLED:false}
  security:
    dev-auth-enabled: ${LAWGROUND_DEV_AUTH_ENABLED:false}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8001/internal/v1}
    api-key: ${AI_SERVICE_API_KEY:}
    connect-timeout: 3s
    timeouts:
      embed: 30s
      tokenize: 30s
      hyde: 60s
      rerank: 60s
      verify: 120s
      answer: 120s
  law:
    api-key: ${LAW_GO_KR_API_KEY:}

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"

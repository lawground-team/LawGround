spring:
  application:
    name: lawground-backend
  profiles:
    default: local
  main:
    web-application-type: servlet
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: '0 * * * * *'
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      enabled: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

lawground:
  batch:
    enabled: ${LAWGROUND_BATCH_ENABLED:false}
    managers: ${LAWGROUND_BATCH_MANAGERS:}
    max-items: ${LAWGROUND_BATCH_MAX_ITEMS:20}
    build-revision: ${LAWGROUND_BATCH_BUILD_REVISION:}
  ui:
    analysis-enabled: ${LAWGROUND_UI_ANALYSIS_ENABLED:false}
  evaluation:
    enabled: ${LAWGROUND_EVALUATION_ENABLED:false}
    managers: ${LAWGROUND_EVALUATION_MANAGERS:}
    max-cases-per-run: ${LAWGROUND_EVALUATION_MAX_CASES:20}
    build-revision: ${LAWGROUND_EVALUATION_BUILD_REVISION:}
  analysis:
    mock-enabled: ${LAWGROUND_ANALYSIS_MOCK_ENABLED:false}
    verification:
      enabled: ${LAWGROUND_VERIFICATION_ENABLED:false}
      model-name: ${AI_VERIFIER_MODEL_NAME:}
      model-revision: ${AI_VERIFIER_MODEL_REVISION:}
      prompt-version: ${AI_VERIFIER_PROMPT_VERSION:}
    live:
      enabled: ${LAWGROUND_ANALYSIS_LIVE_ENABLED:false}
      law-ids: ${LAWGROUND_ANALYSIS_LIVE_LAW_IDS:}
      candidate-limit: ${LAWGROUND_ANALYSIS_LIVE_CANDIDATE_LIMIT:5}
      top-k: ${LAWGROUND_ANALYSIS_LIVE_TOP_K:5}
  security:
    dev-auth-enabled: ${LAWGROUND_DEV_AUTH_ENABLED:false}
    oidc:
      enabled: ${LAWGROUND_OIDC_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8001/internal/v1}
    api-key: ${AI_SERVICE_API_KEY:}
    embedding-model-revision: ${AI_EMBEDDING_MODEL_REVISION:}
    tokenizer-version: ${AI_TOKENIZER_VERSION:}
    reranker-model-revision: ${AI_RERANKER_MODEL_REVISION:}
    max-response-bytes: 4194304
    smoke-enabled: false
    smoke-capabilities: TOKENIZE,EMBED,RERANK
    connect-timeout: 3s
    timeouts:
      embed: 30s
      tokenize: 30s
      hyde: 60s
      rerank: 60s
      verify: 120s
      answer: 120s
  law:
    api-key: ${LAW_GO_KR_API_KEY:}

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.springframework.security: WARN
    org.springframework.web.client: WARN
    org.springframework.jdbc.core: WARN
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"
